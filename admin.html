<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112639" />
    <title>量研 · 指标管理</title>
    <link rel="stylesheet" href="./styles.css?v=20261112m" />
    <link rel="stylesheet" href="./platform.css?v=20261120b" />
  </head>
  <body class="admin-body">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">∿</div>
        <div>
          <strong>量研<span>指标平台</span></strong>
          <small>QUANT INDICATOR PLATFORM</small>
        </div>
      </div>
      <nav class="topbar-section topbar-nav" aria-label="平台导航">
        <div class="topbar-divider" aria-hidden="true"></div>
        <a href="./index.html" class="topbar-nav-item"
          ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
          指标工作台</a
        >
        <a href="./admin.html" class="topbar-nav-item active" aria-current="page"
          ><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
          指标管理</a
        >
      </nav>
      <div class="topbar-right">
        <div class="user-menu" id="user-menu"></div>
      </div>
    </header>

    <main class="admin-main">
      <div class="page-heading admin-heading">
        <div>
          <div class="eyebrow">INDICATOR ADMIN / 指标管理</div>
          <h1>指标管理</h1>
          <p>工作台「保存 / 另存为」的指标汇集于此，新指标默认下架；在这里上架到各应用、下架、查看与编辑。</p>
        </div>
        <div class="heading-actions">
          <button type="button" id="btn-logs"
            ><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6M8 13h8M8 17h5" /></svg>操作日志</button
          >
          <a class="btn-link primary" href="./index.html?new=1">+ 去工作台新建指标</a>
        </div>
      </div>

      <section class="panel admin-panel" aria-label="指标列表">
        <div class="filter-bar">
          <input type="search" id="f-keyword" placeholder="搜索编码 / 名称 / 描述" />
          <select id="f-type" aria-label="指标类型"></select>
          <select id="f-status" aria-label="上下架状态"></select>
          <select id="f-app" aria-label="应用"></select>
          <select id="f-pricing" aria-label="收费"></select>
          <button type="button" class="text-button" id="f-reset">重置筛选</button>
          <span class="spacer"></span>
          <span class="muted small" id="f-summary"></span>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table" id="ind-table">
            <thead>
              <tr>
                <th class="col-code">指标编码</th>
                <th class="col-name">指标名称</th>
                <th class="col-desc">指标描述</th>
                <th>指标类型</th>
                <th>画线方法</th>
                <th class="col-periods">适用周期</th>
                <th>适用范围</th>
                <th>收费</th>
                <th>上下架状态</th>
                <th class="col-apps">应用</th>
                <th>创建人</th>
                <th class="col-time sortable" data-sort="createdAt">创建时间<i class="sort-ind" aria-hidden="true"></i></th>
                <th class="col-time sortable" data-sort="updatedAt">更新时间<i class="sort-ind" aria-hidden="true"></i></th>
                <th class="col-ops">操作</th>
              </tr>
            </thead>
            <tbody id="ind-tbody"></tbody>
          </table>
        </div>
        <div class="pager" id="ind-pager"></div>
      </section>
    </main>

    <!-- 查看 / 编辑 抽屉 -->
    <div class="drawer-overlay" id="drawer-overlay" hidden>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-head">
          <div>
            <h2 id="drawer-title"></h2>
            <div class="drawer-meta" id="drawer-meta"></div>
          </div>
          <button type="button" class="icon-button" id="drawer-close" aria-label="关闭">✕</button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
        <footer class="drawer-foot" id="drawer-foot"></footer>
      </aside>
    </div>

    <!-- 上架 / 下架 确认 -->
    <div class="modal-mask" id="act-mask" hidden role="presentation">
      <div class="modal modal-md" role="dialog" aria-labelledby="act-title" aria-modal="true">
        <header class="modal-head">
          <h3 id="act-title"></h3>
          <p class="modal-meta" id="act-meta"></p>
        </header>
        <div class="modal-body" id="act-body"></div>
        <footer class="modal-foot">
          <button type="button" id="act-cancel">取消</button>
          <button type="button" class="primary" id="act-ok">确定</button>
        </footer>
      </div>
    </div>

    <!-- 操作日志 -->
    <div class="modal-mask" id="logs-mask" hidden role="presentation">
      <div class="modal modal-lg logs-modal" role="dialog" aria-labelledby="logs-title" aria-modal="true">
        <header class="modal-head logs-head">
          <div>
            <h3 id="logs-title">操作日志</h3>
            <p class="modal-meta">保存、编辑、上下架均留痕</p>
          </div>
          <button type="button" class="icon-button" id="logs-close" aria-label="关闭">✕</button>
        </header>
        <div class="filter-bar">
          <input type="search" id="log-keyword" placeholder="搜索编码 / 名称 / 详情" />
          <select id="log-action" aria-label="操作类型"></select>
        </div>
        <div class="modal-body logs-body">
          <table class="admin-table log-table">
            <thead>
              <tr><th class="col-time">时间</th><th>指标编码</th><th>指标名称</th><th>操作</th><th>操作人</th><th>详情</th></tr>
            </thead>
            <tbody id="log-tbody"></tbody>
          </table>
        </div>
        <div class="pager" id="log-pager"></div>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <script src="./tdx-function-catalog.js?v=20261119b"></script>
    <script src="./tdx-formula-runtime.js?v=20261119b"></script>
    <script src="./tdx-formula-engine.js?v=20261119c"></script>
    <script src="./market-data.js?v=20251109"></script>
    <script src="./chart-render.js?v=20261119b"></script>
    <script src="./indicator-registry.js?v=20261120d"></script>
    <script src="./indicator-form.js?v=20261120b"></script>
    <script src="./user-menu.js?v=20261120b"></script>
    <script src="./admin.js?v=20261120c"></script>
  </body>
</html>
